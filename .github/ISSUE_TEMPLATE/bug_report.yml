name: Bug report
description: Report unexpected cfgredact behavior using synthetic data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real credentials, customer data, or production configuration. For a suspected secret leak or bypass, use the private security advisory flow described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or abc1234
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal synthetic input
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      render: text
    validations:
      required: true
