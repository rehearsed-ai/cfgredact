name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          CFGREDACT_LINEAR_LIMIT: 3s
        run: go test ./...
      - name: Race test
        run: go test -race -short ./...
      - name: Check known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
